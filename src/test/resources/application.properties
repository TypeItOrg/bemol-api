spring.application.name=boero-api-test
spring.profiles.active=test
spring.datasource.url=jdbc:h2:mem:boero-api;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=false
spring.sql.init.mode=never
spring.flyway.enabled=false

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

app.jwt.secret=0123456789abcdef0123456789abcdef
app.jwt.access-token-expiration=15m
app.jwt.refresh-token-expiration=7d
app.jwt.remember-me-token-expiration=30d
app.auth.refresh-replay.encryption-key=MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=
app.auth.refresh-replay.ttl=5s
app.auth.email-verification.frontend-url=http://localhost:3000
app.auth.email-verification.token-expiration=24h
app.auth.email-verification.resend-interval=60s
app.webauthn.rp-id=localhost
app.webauthn.rp-name=Boero
app.webauthn.allowed-origins=http://localhost:3000
app.webauthn.challenge-ttl=PT5M
app.webauthn.login-attempt-ttl=PT5M
app.webauthn.max-passkeys=10
app.webauthn.recent-auth-ttl=PT5M

app.platform-admin.email=admin@plataforma.com
app.platform-admin.password=admin123
app.platform-admin.name=Administrador
app.platform-admin.last-name=Plataforma

spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.cache.type=simple

spring.mail.host=localhost
spring.mail.port=1025

# Keep test uploads isolated from development storage.
app.storage.provider=local
app.storage.base-dir=build/tmp/test-storage

# Legacy test slices stay isolated; PostgreSQL Envers integrations opt in explicitly.
spring.jpa.properties.hibernate.integration.envers.enabled=false
spring.jpa.properties.org.hibernate.envers.audit_table_prefix=envers_poc_
spring.jpa.properties.org.hibernate.envers.audit_table_suffix=_aud
spring.jpa.properties.org.hibernate.envers.store_data_at_delete=true
