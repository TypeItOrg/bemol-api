spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.flyway.locations=classpath:db/migration,classpath:db/dev
spring.sql.init.mode=never
server.forward-headers-strategy=native
logging.level.org.springframework=INFO
logging.level.ar.edu.utn.frvm.typeit=DEBUG

logging.file.name=/app/logs/boero-api.log
logging.logback.rollingpolicy.file-name-pattern=/app/logs/archive/boero-api-%d{yyyy-MM-dd}.%i.log.gz


app.jwt.secret=${JWT_SECRET}

app.webauthn.rp-id=${WEBAUTHN_RP_ID}
app.webauthn.allowed-origins=${WEBAUTHN_ALLOWED_ORIGINS}

app.platform-admin.email=${PLATFORM_ADMIN_EMAIL:}
app.platform-admin.password=${PLATFORM_ADMIN_PASSWORD:}

app.institutional-dev-user.password=${INSTITUTIONAL_DEV_USER_PASSWORD:}

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
