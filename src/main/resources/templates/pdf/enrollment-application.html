<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'none'; style-src 'unsafe-inline'; img-src data:; font-src data:; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title th:text="${data.settings.title}">Solicitud de inscripción</title>
    <style th:utext="${fontCss}"></style>
    <style>
      @page {
        size: A4;
        margin: 9mm 10mm 12mm;
        @bottom-right {
          content: "Página " counter(page) " / " counter(pages);
          font: 7pt Manrope, sans-serif;
          color: #444;
        }
      }
      * { box-sizing: border-box; }
      /* External padding keeps every cloned frame inside Chromium's printable clip. */
      body { margin: 0; padding: 0 0.75pt 0.75pt 0; box-decoration-break: clone; color: #111; font: 9pt/1.35 Manrope, sans-serif; }
      .application-form { border: 0.75pt solid #333; box-decoration-break: clone; }
      h1, h2, p, dl, dd { margin: 0; }
      .institution { display: flex; align-items: stretch; gap: 4mm; padding: 4mm; break-inside: avoid; }
      .logo-frame { position: relative; flex: 0 0 24mm; }
      .logo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; object-position: left center; }
      .institution-details { flex: 1; min-width: 0; text-align: center; }
      .institution-name { font-size: 12pt; font-weight: 700; line-height: 1.3; }
      .institution-contact { margin-top: 1mm; color: #444; font-size: 8pt; }
      .institution-contacts { display: flex; flex-wrap: wrap; justify-content: center; gap: 1mm 5mm; }
      .institution-contacts p { min-width: 0; max-width: 100%; }
      .institution-heading { margin-top: 2mm; font-size: 7.5pt; color: #444; }
      .multiline { white-space: pre-wrap; overflow-wrap: anywhere; }
      .document-identification, h2 { position: relative; border-bottom: 0.75pt solid #333; }
      /* Shared top edges overlap the preceding rule, including the cloned page frame. */
      .document-identification::before, h2::before { content: ""; position: absolute; top: -0.75pt; left: 0; right: 0; border-top: 0.75pt solid #333; }
      .document-identification { padding: 2.5mm 4mm; background: #444; color: #fff; break-inside: avoid; }
      h1 { font-size: 12pt; font-weight: 700; line-height: 1.3; text-align: center; text-transform: uppercase; letter-spacing: 0.04em; overflow-wrap: anywhere; }
      .metadata { flex: 0 0 32mm; display: flex; flex-direction: column; justify-content: space-between; gap: 1.2mm; text-align: left; }
      .metadata-item { min-width: 0; }
      .metadata-item:only-child { margin-block: auto; }
      .metadata dt { margin-bottom: 0.4mm; font-size: 7pt; line-height: 1.15; color: #444; }
      .metadata dd { font-size: 8pt; line-height: 1.15; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
      .introduction { padding: 3mm 4mm; }
      .section { break-inside: avoid; }
      h2 { padding: 1.5mm 4mm; background: #ededed; font-size: 8.5pt; font-weight: 700; line-height: 1.3; text-transform: uppercase; letter-spacing: 0.04em; break-after: avoid; }
      .fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 2.5mm 6mm; padding: 2.5mm 4mm 3mm; }
      .field { display: flex; flex-direction: column; min-width: 0; break-inside: avoid; }
      .field:last-child:nth-child(odd) { grid-column: 1 / -1; }
      .label { margin-bottom: 1mm; color: #444; font-size: 7.5pt; }
      .value { flex: 1; min-height: 5mm; padding-bottom: 1mm; border-bottom: 0.2mm solid #777; font-size: 9pt; white-space: pre-wrap; overflow-wrap: anywhere; }
      table { width: 100%; table-layout: fixed; border-collapse: collapse; font-size: 8pt; }
      thead { display: table-header-group; break-after: avoid; }
      .selection-group, tr { break-inside: avoid; }
      th { padding: 2mm 1.5mm; text-align: left; font-size: 7.5pt; font-weight: 700; border-bottom: 0.75pt solid #333; }
      th + th { border-left: 0.75pt solid #333; }
      td { padding: 2mm 1.5mm; vertical-align: top; border-bottom: 0.18mm solid #888; overflow-wrap: anywhere; }
      td + td { border-left: 0.18mm solid #aaa; }
      th:first-child, td:first-child { padding-left: 4mm; }
      th:not(:first-child), td:not(:first-child) { text-align: center; vertical-align: middle; }
      td.document-end-cell { padding: 0; border: 0; }
      .selection-name { font-weight: 500; }
      .selection-plan { margin-top: 0.8mm; font-size: 7pt; color: #444; }
      .missing-value { color: #666; font-style: italic; }
      .document-end { break-inside: avoid; }
      .signatures { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10mm; padding: 20mm 4mm 4mm; break-inside: avoid; }
      .signature { flex: 1; min-width: 60mm; max-width: 85mm; padding-top: 2mm; border-top: 0.2mm solid #333; font-size: 7.5pt; text-align: center; }
      .closing { padding: 3mm 4mm; border-top: 0.2mm solid #999; break-inside: avoid; }
      .footer { font-size: 8pt; }
      @media print { body { print-color-adjust: exact; -webkit-print-color-adjust: exact; } }
    </style>
  </head>
  <body>
    <main class="application-form">
      <header class="institution">
        <div class="logo-frame" th:if="${data.logoDataUri != null}">
          <img class="logo" th:src="${data.logoDataUri}" alt="Logo institucional" />
        </div>
        <div class="institution-details">
          <p class="institution-name multiline" th:text="${data.institution.name}">Institución</p>
          <p class="institution-contact institution-address multiline" th:classappend="${data.institution.address == 'Sin informar' ? 'missing-value' : ''}" th:text="${data.institution.address}"></p>
          <div class="institution-contact institution-contacts">
            <p class="multiline" th:classappend="${data.institution.phone == 'Sin informar' ? 'missing-value' : ''}" th:text="${data.institution.phone}"></p>
            <p class="multiline" th:classappend="${data.institution.email == 'Sin informar' ? 'missing-value' : ''}" th:text="${data.institution.email}"></p>
          </div>
          <p class="institution-heading multiline" th:if="${data.settings.headerText != null}" th:text="${data.settings.headerText}"></p>
        </div>
        <dl class="metadata">
          <div class="metadata-item" th:if="${submittedAt != null}"><dt>Fecha de presentación</dt><dd th:text="${submittedAt}"></dd></div>
          <div class="metadata-item"><dt>Fecha de emisión</dt><dd th:text="${generatedAt}"></dd></div>
        </dl>
      </header>
      <section class="document-identification">
        <h1 th:text="${data.settings.title}">Solicitud de inscripción</h1>
      </section>
      <p class="introduction multiline" th:if="${data.settings.introductionText != null}" th:text="${data.settings.introductionText}"></p>
      <div class="application-data" th:if="${!data.sections.isEmpty()}">
        <section class="section" th:each="section : ${data.sections}">
          <h2 th:text="${section.title}">Datos del estudiante</h2>
          <div class="fields">
            <div class="field" th:each="field : ${section.fields}">
              <p class="label" th:text="${field.label}"></p>
              <p class="value" th:classappend="${field.value == 'Sin informar' ? 'missing-value' : ''}" th:text="${field.value}"></p>
            </div>
          </div>
        </section>
      </div>
      <section class="academic-section" th:if="${!data.selections.isEmpty()}">
        <h2 th:text="${data.coursesSelected ? 'Cursos solicitados' : 'Espacios solicitados'}">Espacios solicitados</h2>
        <table>
          <thead><tr><th style="width: 40%" th:text="${data.coursesSelected ? 'Curso' : 'Espacio académico'}">Espacio académico</th><th style="width: 17%">Nivel</th><th style="width: 22%">Instrumento</th><th style="width: 21%">Estado</th></tr></thead>
          <tbody class="selection-group" th:each="selection, selectionStatus : ${data.selections}">
            <tr>
              <td><p class="selection-name" th:text="${selection.name}"></p><p class="selection-plan" th:text="${selection.studyPlan}"></p></td>
              <td th:classappend="${selection.level == 'Sin informar' ? 'missing-value' : ''}" th:text="${selection.level}"></td>
              <td th:classappend="${selection.instrument == 'Sin informar' ? 'missing-value' : ''}" th:text="${selection.instrument}"></td>
              <td th:text="${selection.status}"></td>
            </tr>
            <tr th:if="${selectionStatus.last}">
              <td class="document-end-cell" colspan="4"><div th:replace="~{::documentEnd}"></div></td>
            </tr>
          </tbody>
        </table>
      </section>
      <th:block th:if="${data.selections.isEmpty()}">
        <div class="document-end" th:fragment="documentEnd">
          <div class="signatures" th:if="${data.settings.showApplicantSignature || (data.settings.showResponsibleSignature &amp;&amp; data.hasResponsible)}">
            <p class="signature" th:if="${data.settings.showApplicantSignature}">Firma y aclaración del solicitante</p>
            <p class="signature" th:if="${data.settings.showResponsibleSignature &amp;&amp; data.hasResponsible}">Firma y aclaración del responsable</p>
          </div>
          <footer class="closing" th:if="${data.settings.footerText != null}">
            <p class="footer multiline" th:text="${data.settings.footerText}"></p>
          </footer>
        </div>
      </th:block>
    </main>
  </body>
</html>
