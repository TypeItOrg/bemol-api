<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <body style="margin: 0; color: #1f1f1f; font-family: Arial, Helvetica, sans-serif; height: 100%; min-height: 100vh">
    <table
      role="presentation"
      width="100%"
      height="100%"
      cellspacing="0"
      cellpadding="0"
      style="min-height: 100vh; padding: 24px 16px"
    >
      <tr>
        <td align="center" valign="middle">
          <table
            role="presentation"
            width="100%"
            cellspacing="0"
            cellpadding="0"
            style="max-width: 420px; background: #ffffff; border: 1px solid #e6e0db; border-radius: 14px"
          >
            <tr>
              <td align="center" style="padding: 36px 24px 0">
                <img
                  th:src="${logoUrl}"
                  width="64"
                  height="88"
                  alt="Logo de la institución"
                  style="display: block; width: 64px; height: auto; border: 0"
                />
              </td>
            </tr>
            <tr>
              <td align="center" style="padding: 28px 24px 0">
                <h1 style="margin: 0 0 8px; color: #1f1f1f; font-size: 24px; line-height: 1.25">Activá tu acceso a Bemol</h1>
                <p style="margin: 0; color: #776d68; font-size: 14px; line-height: 1.5">
                  Hola,
                  <strong th:text="${fullName}" style="color: #1f1f1f">Ana García</strong>. Te invitaron a acceder con tu propia cuenta a
                  <strong th:text="${institutionName}" style="color: #1f1f1f">Conservatorio Superior de Música Felipe Boero</strong>.
                </p>
              </td>
            </tr>
            <tr>
              <td style="padding: 26px 24px 0">
                <table role="presentation" width="100%" cellspacing="0" cellpadding="0">
                  <tr>
                    <td align="center">
                      <a
                        th:href="${activationUrl}"
                        style="
                          display: block;
                          background: #76002f;
                          border: 1px solid #76002f;
                          border-radius: 8px;
                          color: #ffffff;
                          padding: 8px 10px;
                          text-decoration: none;
                          font-size: 14px;
                          font-weight: 500;
                          line-height: 18px;
                          text-align: center;
                        "
                      >
                        Configurar mi contraseña
                      </a>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
            <tr>
              <td align="center" style="padding: 22px 24px 36px">
                <p style="margin: 0; color: #776d68; font-size: 14px; line-height: 1.5">
                  Este enlace vence en
                  <strong th:text="${expirationHours + ' horas'}" style="color: #1f1f1f">24 horas</strong>
                  y puede usarse una sola vez. Si no solicitaste este acceso, podés ignorar este correo.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
