spring.application.name=boero-api
server.port=${SERVER_PORT:8080}
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.probes.add-additional-paths=true
management.endpoint.health.group.readiness.include=readinessState,db,redis
management.endpoint.health.show-details=never

springdoc.api-docs.enabled=true
springdoc.enable-default-api-docs=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.supported-submit-methods=

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# Batchea el fetch de asociaciones/colecciones LAZY (IN (...) en vez de N+1 selects).
# Evita MultipleBagFetchException que tendria un @EntityGraph con dos List a la vez
# (p.ej. EnrollmentApplication.attachments + selectedSpaces).
spring.jpa.properties.hibernate.default_batch_fetch_size=25
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.datasource.hikari.connection-init-sql=SET TIME ZONE 'UTC'
spring.sql.init.mode=never

spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=50

spring.flyway.locations=classpath:db/migration
spring.flyway.sql-migration-prefix=
spring.flyway.validate-migration-naming=true
# Feature branches can merge after newer timestamped migrations have been deployed.
spring.flyway.out-of-order=true

spring.lifecycle.timeout-per-shutdown-phase=20s

app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-expiration=15m
app.jwt.refresh-token-expiration=7d
app.jwt.remember-me-token-expiration=30d
app.auth.refresh-replay.encryption-key=${REFRESH_REPLAY_ENCRYPTION_KEY}
app.auth.refresh-replay.ttl=${REFRESH_REPLAY_TTL:5s}
app.auth.password-recovery.frontend-url=${PASSWORD_RECOVERY_FRONTEND_URL:http://localhost:3000}
app.auth.password-recovery.token-expiration=${PASSWORD_RECOVERY_TOKEN_EXPIRATION:30m}
app.webauthn.rp-id=${WEBAUTHN_RP_ID}
app.webauthn.rp-name=${WEBAUTHN_RP_NAME:Boero}
app.webauthn.allowed-origins=${WEBAUTHN_ALLOWED_ORIGINS}
app.webauthn.challenge-ttl=${WEBAUTHN_CHALLENGE_TTL:PT5M}
app.webauthn.login-attempt-ttl=${WEBAUTHN_LOGIN_ATTEMPT_TTL:PT5M}
app.webauthn.max-passkeys=${WEBAUTHN_MAX_PASSKEYS:10}
app.webauthn.recent-auth-ttl=${WEBAUTHN_RECENT_AUTH_TTL:PT5M}

spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from=${MAIL_FROM:no-reply@boero.local}

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.repositories.enabled=false
spring.cache.redis.time-to-live=5m

logging.level.root=INFO
# File parsers may include untrusted document fragments in diagnostics.
logging.level.org.apache.pdfbox=OFF

logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30
logging.logback.rollingpolicy.total-size-cap=1GB

logging.pattern.level=%5p [req:%X{requestId:-system}]

app.auth.email-verification.frontend-url=${EMAIL_VERIFICATION_FRONTEND_URL:${PASSWORD_RECOVERY_FRONTEND_URL:http://localhost:3000}}
app.auth.email-verification.token-expiration=${EMAIL_VERIFICATION_TOKEN_EXPIRATION:24h}
app.auth.email-verification.resend-interval=${EMAIL_VERIFICATION_RESEND_INTERVAL:60s}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB
# One provider for all application files.
app.storage.base-dir=${STORAGE_LOCAL_DIR:storage}
app.storage.provider=${STORAGE_PROVIDER:local}
app.storage.s3.bucket=${STORAGE_S3_BUCKET:}
app.storage.s3.region=${AWS_REGION:us-east-1}
app.storage.s3.prefix=${STORAGE_S3_PREFIX:boero/}

# Canonical frontend identity; empty domain keeps direct/generic development behavior.
app.frontend.public-url=${FRONTEND_PUBLIC_URL:${PASSWORD_RECOVERY_FRONTEND_URL:http://localhost:3000}}
app.frontend.institutional-base-domain=${INSTITUTIONAL_BASE_DOMAIN:}
app.frontend.fallback-url=${PASSWORD_RECOVERY_FRONTEND_URL:http://localhost:3000}
