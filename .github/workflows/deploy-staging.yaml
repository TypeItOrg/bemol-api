name: Deploy staging

on:
  push:
    branches:
      - staging

concurrency:
  group: deploy-staging-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: ./.github/workflows/ci.yaml
    permissions:
      contents: read

  publish-image:
    if: github.event_name == 'push' && github.ref_name == 'staging'
    needs: ci
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and publish image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: prod
          push: true
          tags: |
            ghcr.io/typeitorg/bemol-api:sha-${{ github.sha }}
            ghcr.io/typeitorg/bemol-api:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    if: github.event_name == 'push' && github.ref_name == 'staging'
    needs: publish-image
    runs-on: ubuntu-24.04
    environment: staging
    permissions:
      contents: read
    steps:
      - name: Request staging deployment
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_STAGING_COMPOSE_ID: ${{ secrets.DOKPLOY_STAGING_COMPOSE_ID }}
        run: |
          : "${DOKPLOY_URL:?Missing DOKPLOY_URL}"
          : "${DOKPLOY_API_KEY:?Missing DOKPLOY_API_KEY}"
          : "${DOKPLOY_STAGING_COMPOSE_ID:?Missing DOKPLOY_STAGING_COMPOSE_ID}"

          curl --proto '=https' --fail --silent --show-error --max-time 60 \
            --request POST "${DOKPLOY_URL%/}/api/compose.deploy" \
            --header "x-api-key: $DOKPLOY_API_KEY" \
            --header 'Content-Type: application/json' \
            --data "$(jq -n --arg composeId "$DOKPLOY_STAGING_COMPOSE_ID" \
              --arg title "$GITHUB_REPOSITORY@$GITHUB_SHA" '{composeId: $composeId, title: $title}')" \
            --output /dev/null
