name: Deploy staging

on:
  push:
    branches:
      - staging

jobs:
  publish-image:
    runs-on: ubuntu-24.04
    concurrency:
      group: publish-staging-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and publish image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: prod
          push: true
          tags: |
            ghcr.io/typeitorg/bemol-api:sha-${{ github.sha }}
            ghcr.io/typeitorg/bemol-api:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    needs: publish-image
    permissions:
      contents: read
    uses: TypeItOrg/bemol-infra/.github/workflows/deploy.yaml@main
    with:
      environment: staging
    secrets: inherit
