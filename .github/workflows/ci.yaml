name: CI

on:
  workflow_call:
  pull_request:
    branches:
      - develop
      - staging
      - main
  push:
    branches:
      - develop
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-analysis:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up analysis toolchains
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            21
            25

      - name: Cache Gradle dependencies and compilation
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ github.sha }}
          restore-keys: gradle-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-

      - name: Check code structure, nullness and compiler warnings
        run: ./gradlew --no-daemon --build-cache --continue codeStructureCheck staticAnalysis --profile

      - name: Upload compiler diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: static-analysis-reports
          path: |
            build/reports/static-analysis/
            build/reports/profile/
          if-no-files-found: ignore

  test-suites:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        suite: [fastTest, integrationTest]
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Gradle dependencies and compilation
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ runner.arch }}-test-${{ matrix.suite }}-${{ github.sha }}
          restore-keys: |
            gradle-${{ runner.os }}-${{ runner.arch }}-test-${{ matrix.suite }}-
            gradle-${{ runner.os }}-${{ runner.arch }}-test-

      - name: Verify formatting and fast test suite
        if: matrix.suite == 'fastTest'
        run: ./gradlew --no-daemon --build-cache spotlessCheck fastTest --profile

      - name: Detect integration-sensitive changes
        if: >-
          matrix.suite == 'integrationTest' &&
          github.event_name == 'pull_request' && github.base_ref == 'develop'
        id: persistence-changes
        shell: bash
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          base_ref="origin/${{ github.base_ref }}"

          if git diff --name-only "$base_ref" HEAD | grep -Eq '^(src/main/resources/(db/migration/|application[^/]*\.properties$)|src/main/java/.+/(entities|interfaces|services|search|config|controllers)/|src/test/java/.+IntegrationTest\.java$|build.gradle$)'; then
            echo "required=true" >> "$GITHUB_OUTPUT"
          else
            echo "required=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run integration test suite
        if: >-
          matrix.suite == 'integrationTest' && (
            steps.persistence-changes.outputs.required == 'true' ||
            (github.event_name == 'push' &&
              (github.ref_name == 'develop' || github.ref_name == 'staging' || github.ref_name == 'main')) ||
            (github.event_name == 'pull_request' &&
              (github.base_ref == 'staging' || github.base_ref == 'main')))
        run: ./gradlew --no-daemon --build-cache integrationTest --profile

      - name: Upload test and timing reports
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: backend-${{ matrix.suite }}-reports
          path: |
            build/test-results/${{ matrix.suite }}/
            build/reports/tests/${{ matrix.suite }}/
            build/reports/profile/
          if-no-files-found: ignore
          retention-days: 7

  test:
    if: always()
    needs: test-suites
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Require successful test suites
        env:
          TEST_SUITES_RESULT: ${{ needs.test-suites.result }}
        run: test "$TEST_SUITES_RESULT" = success
