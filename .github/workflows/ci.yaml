name: CI

on:
  workflow_call:
  pull_request:
    branches:
      - develop
      - staging
      - main
  push:
    branches:
      - develop
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-analysis:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up analysis toolchains
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            21
            25

      - name: Cache Gradle dependencies and compilation
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ github.sha }}
          restore-keys: gradle-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-

      - name: Check code structure, nullness and compiler warnings
        run: ./gradlew --no-daemon --build-cache --continue codeStructureCheck staticAnalysis --profile

      - name: Upload compiler diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: static-analysis-reports
          path: |
            build/reports/static-analysis/
            build/reports/profile/
          if-no-files-found: ignore

  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Gradle dependencies and compilation
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ github.sha }}
          restore-keys: gradle-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-

      - name: Verify formatting and fast test suite
        if: >-
          (github.event_name == 'push' && github.ref_name == 'develop') ||
          (github.event_name == 'pull_request' && github.base_ref == 'develop')
        run: ./gradlew --no-daemon --build-cache spotlessCheck fastTest --profile

      - name: Detect integration-sensitive changes
        if: >-
          (github.event_name == 'push' && github.ref_name == 'develop') ||
          (github.event_name == 'pull_request' && github.base_ref == 'develop')
        id: persistence-changes
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
            base_ref="origin/${{ github.base_ref }}"
          else
            base_ref="${{ github.event.before }}"
            if ! git cat-file -e "${base_ref}^{commit}" 2>/dev/null; then
              base_ref="HEAD^"
            fi
          fi

          if git diff --name-only "$base_ref" HEAD | grep -Eq '^(src/main/resources/(db/migration/|application[^/]*\.properties$)|src/main/java/.+/(entities|interfaces|services|search|config|controllers)/|src/test/java/.+IntegrationTest\.java$|build.gradle$)'; then
            echo "required=true" >> "$GITHUB_OUTPUT"
          else
            echo "required=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run integration tests for persistence changes
        if: steps.persistence-changes.outputs.required == 'true'
        run: ./gradlew --no-daemon --build-cache integrationTest --profile

      - name: Verify formatting and full test suite
        if: >-
          (github.event_name == 'push' &&
            (github.ref_name == 'staging' || github.ref_name == 'main')) ||
          (github.event_name == 'pull_request' &&
            (github.base_ref == 'staging' || github.base_ref == 'main'))
        run: ./gradlew --no-daemon --build-cache spotlessCheck test --profile

      - name: Upload test and timing reports
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: backend-test-reports
          path: |
            build/test-results/
            build/reports/tests/
            build/reports/profile/
          if-no-files-found: ignore
          retention-days: 7
