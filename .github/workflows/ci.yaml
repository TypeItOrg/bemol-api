name: CI

on:
  pull_request:
    branches:
      - develop
      - staging
      - main
  push:
    branches:
      - develop
      - staging
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-analysis:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up analysis toolchains
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            21
            25
          cache: gradle

      - name: Check code structure, nullness and compiler warnings
        run: ./gradlew --no-daemon --continue codeStructureCheck staticAnalysis

      - name: Upload compiler diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static-analysis-reports
          path: build/reports/static-analysis/
          if-no-files-found: ignore

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Verify formatting and fast test suite
        if: >-
          (github.event_name == 'push' && github.ref_name == 'develop') ||
          (github.event_name == 'pull_request' && github.base_ref == 'develop')
        run: ./gradlew --no-daemon spotlessCheck fastTest

      - name: Detect integration-sensitive changes
        if: >-
          (github.event_name == 'push' && github.ref_name == 'develop') ||
          (github.event_name == 'pull_request' && github.base_ref == 'develop')
        id: persistence-changes
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
            base_ref="origin/${{ github.base_ref }}"
          else
            base_ref="${{ github.event.before }}"
            if ! git cat-file -e "${base_ref}^{commit}" 2>/dev/null; then
              base_ref="HEAD^"
            fi
          fi

          if git diff --name-only "$base_ref" HEAD | grep -Eq '^(src/main/resources/db/migration/|src/main/java/.+/(entities|interfaces|services|search|config|controllers)/|build.gradle$)'; then
            echo "required=true" >> "$GITHUB_OUTPUT"
          else
            echo "required=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run integration tests for persistence changes
        if: steps.persistence-changes.outputs.required == 'true'
        run: ./gradlew --no-daemon integrationTest

      - name: Verify formatting and full test suite
        if: >-
          (github.event_name == 'push' &&
            (github.ref_name == 'staging' || github.ref_name == 'main')) ||
          (github.event_name == 'pull_request' &&
            (github.base_ref == 'staging' || github.base_ref == 'main'))
        run: ./gradlew --no-daemon spotlessCheck test

  publish-image:
    if: >-
      github.event_name == 'push' &&
      (github.ref_name == 'develop' || github.ref_name == 'staging' || github.ref_name == 'main')
    needs: [static-analysis, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and publish image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: prod
          push: true
          tags: |
            ghcr.io/typeitorg/boero-api:sha-${{ github.sha }}
            ghcr.io/typeitorg/boero-api:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    if: github.event_name == 'push' && github.ref_name == 'staging'
    needs: publish-image
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
    steps:
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy API to staging
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          ssh -p "$DEPLOY_PORT" -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd /opt/boero-infra && flock /tmp/boero-infra-git.lock git pull --ff-only && make deploy-api ENV=staging VERSION=sha-${{ github.sha }}"
