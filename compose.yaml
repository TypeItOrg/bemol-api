services:
  dev:
    container_name: boero-api-dev
    image: boero-api:dev
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    command: ["/usr/local/bin/dev-entrypoint.sh"]
    env_file:
      - path: .env.dev
        required: false
    environment:
      SERVER_PORT: ${SERVER_PORT:-8080}
      STORAGE_LOCAL_DIR: /workspace/storage
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-boero_db}
      DB_USER: ${DB_USER:-boero}
      DB_PASSWORD: ${DB_PASSWORD:-boero}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      JWT_SECRET: ${JWT_SECRET:-0123456789abcdef0123456789abcdef}
      REFRESH_REPLAY_ENCRYPTION_KEY: ${REFRESH_REPLAY_ENCRYPTION_KEY:-MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=}
      REFRESH_REPLAY_TTL: ${REFRESH_REPLAY_TTL:-5s}
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-false}
      MAIL_SMTP_STARTTLS: ${MAIL_SMTP_STARTTLS:-false}
      MAIL_FROM: ${MAIL_FROM:-no-reply@boero.local}
      PASSWORD_RECOVERY_FRONTEND_URL: ${PASSWORD_RECOVERY_FRONTEND_URL:-http://localhost:3000}
      EMAIL_VERIFICATION_FRONTEND_URL: ${EMAIL_VERIFICATION_FRONTEND_URL:-${PASSWORD_RECOVERY_FRONTEND_URL:-http://localhost:3000}}
      EMAIL_VERIFICATION_TOKEN_EXPIRATION: ${EMAIL_VERIFICATION_TOKEN_EXPIRATION:-24h}
      EMAIL_VERIFICATION_RESEND_INTERVAL: ${EMAIL_VERIFICATION_RESEND_INTERVAL:-60s}
      PASSWORD_RECOVERY_TOKEN_EXPIRATION: ${PASSWORD_RECOVERY_TOKEN_EXPIRATION:-30m}
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-localhost}
      WEBAUTHN_RP_NAME: ${WEBAUTHN_RP_NAME:-Boero}
      WEBAUTHN_ALLOWED_ORIGINS: ${WEBAUTHN_ALLOWED_ORIGINS:-http://localhost:3000}
      WEBAUTHN_CHALLENGE_TTL: ${WEBAUTHN_CHALLENGE_TTL:-PT5M}
      WEBAUTHN_LOGIN_ATTEMPT_TTL: ${WEBAUTHN_LOGIN_ATTEMPT_TTL:-PT5M}
      WEBAUTHN_MAX_PASSKEYS: ${WEBAUTHN_MAX_PASSKEYS:-10}
      WEBAUTHN_RECENT_AUTH_TTL: ${WEBAUTHN_RECENT_AUTH_TTL:-PT5M}
      SPRING_PROFILES_ACTIVE: dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    ports:
      - "8080:8080"
    volumes:
      - gradle-cache:/home/gradle/.gradle
      - storage:/workspace/storage
    logging:
      driver: "local"
      options:
        max-size: "10m"
        max-file: "3"
    develop:
      watch:
        - action: sync
          path: ./src
          target: /workspace/src
          initial_sync: true
        - action: rebuild
          path: ./build.gradle
        - action: rebuild
          path: ./settings.gradle
        - action: rebuild
          path: ./gradle
        - action: rebuild
          path: ./gradlew
        - action: rebuild
          path: ./Dockerfile
        - action: rebuild
          path: ./docker

  redis:
    container_name: boero-api-redis-dev
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    logging:
      driver: "local"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  mailpit:
    container_name: boero-api-mailpit-dev
    image: axllent/mailpit:v1.24
    ports:
      - "1025:1025"
      - "8025:8025"

  postgres:
    container_name: boero-api-postgres-dev
    image: postgres:18-alpine
    command: ["/bin/sh", "/usr/local/bin/postgres-entrypoint.sh"]
    environment:
      DB_NAME: ${DB_NAME:-boero_db}
      POSTGRES_DB: ${DB_NAME:-boero_db}
      POSTGRES_USER: ${DB_USER:-boero}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-boero}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres-entrypoint.sh:/usr/local/bin/postgres-entrypoint.sh:ro
    logging:
      driver: "local"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 45s

volumes:
  storage:
    name: boero-api-storage-dev
  gradle-cache:
    name: boero-api-gradle-cache-dev
  postgres-data:
    name: boero-api-postgres-data-dev

networks:
  default:
    name: boero-api-network-dev
